<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAHAT Command Centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=JetBrains+Mono:wght@400;500&family=Mukta:wght@400;600;700&family=Tiro+Devanagari+Hindi&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* Layout: full-bleed live satellite map; glass instrument panels float over it (watchlist left, response plan right, radar dock bottom). */
:root{
  --night:#060B16; --glass:rgba(8,14,28,.80); --glass-2:rgba(14,22,40,.86);
  --line:rgba(150,175,215,.14); --line-2:rgba(150,175,215,.26);
  --ink:#E8EEF7; --dim:#97A4BA; --faint:#5F6C83;
  --river:#6CB6FF; --river-deep:#1D5FA8;
  --g:#22C55E; --y:#FACC15; --o:#FB923C; --r:#EF4444; --u:#64748B;
  --paper:#F5F6F8; --paper-ink:#0B1220; --paper-dim:#556072; --paper-line:#DCE1E8;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --f-hi:"Mukta","Nirmala UI",sans-serif;
  --f-hi-display:"Tiro Devanagari Hindi","Nirmala UI",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font:14px/1.45 var(--f-body);font-variation-settings:"wdth" 100;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--river);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font:600 10.5px/1 var(--f-display);font-variation-settings:"wdth" 72;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}

/* top bar */
.top{position:fixed;inset:0 0 auto;height:56px;display:flex;align-items:center;gap:18px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:linear-gradient(var(--night),rgba(6,11,22,.55));border-bottom:1px solid var(--line);z-index:20}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.brand b{font:800 19px/1 var(--f-display);font-variation-settings:"wdth" 125;letter-spacing:.08em}
.brand span{font:22px/1 var(--f-hi-display);color:var(--river)}
.brand i{font-style:normal;color:var(--faint);font:500 12px var(--f-display);font-variation-settings:"wdth" 85;letter-spacing:.06em}
.health{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border:1px solid var(--line-2);border-radius:999px;font:500 11px var(--f-mono);color:var(--dim);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--u)}
.chip[data-s=live]::before{background:var(--g);box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.chip[data-s=fallback]::before{background:var(--y)}
.chip[data-s=down]::before{background:var(--r)}
.chip[data-s=wait]::before{background:var(--u);animation:blink 1s infinite}
.clock{font:500 13px var(--f-mono);color:var(--ink);white-space:nowrap}
.toggle{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line-2);background:transparent;font:600 12px var(--f-display);font-variation-settings:"wdth" 90;letter-spacing:.04em}
.toggle[aria-pressed=true]{background:var(--ink);color:var(--night);border-color:var(--ink)}
@keyframes blink{50%{opacity:.3}}

/* stage */
#map{position:fixed;inset:0}
.panel{position:fixed;top:68px;bottom:96px;background:var(--glass);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);border:1px solid var(--line);border-radius:14px;z-index:10;display:flex;flex-direction:column;min-height:0}
.panel header{padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.scroll{overflow:auto;min-height:0;flex:1;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.left{left:max(12px,env(safe-area-inset-left,0px));width:318px}
.right{right:max(12px,env(safe-area-inset-right,0px));width:392px}

/* watchlist */
.place{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:transparent}
.place:hover{background:rgba(150,175,215,.05)}
.place[aria-current=true]{background:rgba(108,182,255,.08)}
.place h3{margin:0;font:700 15px/1.2 var(--f-display);font-variation-settings:"wdth" 108}
.place .sub{grid-column:1/-1;color:var(--dim);font-size:12px}
.place .metrics{grid-column:1/-1;display:flex;gap:12px;margin-top:6px;font:500 11.5px var(--f-mono);color:var(--dim)}
.place .metrics b{color:var(--ink);font-weight:500}
.place svg{grid-column:1/-1;margin-top:6px;width:100%;height:26px;display:block}
.gauge{display:flex;align-items:center;gap:6px;font:700 10.5px var(--f-display);font-variation-settings:"wdth" 75;letter-spacing:.14em}
.gauge .seg{display:flex;gap:2px}
.gauge .seg i{width:7px;height:12px;border-radius:2px;background:rgba(150,175,215,.16)}
.gauge[data-l=green] .seg i:nth-child(-n+1){background:var(--g)}
.gauge[data-l=yellow] .seg i:nth-child(-n+2){background:var(--y)}
.gauge[data-l=orange] .seg i:nth-child(-n+3){background:var(--o)}
.gauge[data-l=red] .seg i{background:var(--r)}
.gauge[data-l=unknown] .seg i{background:repeating-linear-gradient(45deg,var(--u) 0 2px,transparent 2px 4px)}
.gauge[data-l=green]{color:var(--g)} .gauge[data-l=yellow]{color:var(--y)} .gauge[data-l=orange]{color:var(--o)} .gauge[data-l=red]{color:var(--r)} .gauge[data-l=unknown]{color:var(--u)}

/* incident */
.inc-head{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.inc-head h2{margin:6px 0 2px;font:800 30px/1.05 var(--f-display);font-variation-settings:"wdth" 112;letter-spacing:-.01em;text-wrap:balance}
.inc-head p{margin:0;color:var(--dim);font-size:12px}
.sec{padding:14px 16px;border-bottom:1px solid var(--line)}
.sec .label{margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.why{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.why li{display:grid;grid-template-columns:10px 1fr;gap:10px;font-size:13px}
.why li::before{content:"";width:8px;height:8px;border-radius:2px;margin-top:5px;background:var(--c,var(--u))}
.why small{display:block;color:var(--faint);font:500 11px var(--f-mono);margin-top:1px}
.trace{list-style:none;margin:0;padding:0;position:relative}
.trace::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:1px;background:var(--line-2)}
.step{position:relative;display:grid;grid-template-columns:24px 1fr auto;gap:10px;padding:0 0 14px}
.step .dot{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:var(--glass-2);border:1px solid var(--line-2);font:600 11px var(--f-mono);z-index:1}
.step[data-s=run] .dot{border-color:var(--river);color:var(--river)}
.step[data-s=run] .dot::after{content:"";position:absolute;width:23px;height:23px;border-radius:50%;border:1px solid var(--river);animation:ping 1.2s infinite}
.step[data-s=ok] .dot{background:#0F2A1A;border-color:var(--g);color:var(--g)}
.step[data-s=fix] .dot{background:#2A2208;border-color:var(--y);color:var(--y)}
.step[data-s=fail] .dot{background:#2A0E10;border-color:var(--r);color:var(--r)}
.step[data-s=idle]{opacity:.45}
.step b{font:700 13px var(--f-display);font-variation-settings:"wdth" 100}
.step p{margin:2px 0 0;color:var(--dim);font-size:12.5px}
.step .t{font:500 11px var(--f-mono);color:var(--faint);padding-top:3px}
.src{display:inline-block;margin:4px 4px 0 0;padding:1px 6px;border-radius:4px;background:rgba(108,182,255,.1);color:var(--river);font:500 10.5px var(--f-mono)}
.src.warn{background:rgba(250,204,21,.1);color:var(--y)}
@keyframes ping{from{transform:scale(1);opacity:.9}to{transform:scale(1.7);opacity:0}}
.msg{border:1px solid var(--line-2);border-radius:10px;padding:12px;background:rgba(6,11,22,.5)}
.msg .hi{font:500 15.5px/1.55 var(--f-hi)}
.msg .en{margin-top:8px;color:var(--dim);font-size:12.5px}
.funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.funnel div{padding:10px;border-radius:8px;background:rgba(150,175,215,.06)}
.funnel b{display:block;font:500 20px var(--f-mono)}
.funnel span{font-size:11px;color:var(--dim)}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:10px;background:rgba(150,175,215,.12)}
.tag{font:500 10px var(--f-mono);letter-spacing:.02em;text-transform:none;color:var(--faint);border:1px dashed var(--line-2);padding:2px 6px;border-radius:4px}
.cta{margin-top:12px;width:100%;height:38px;border-radius:9px;border:0;background:var(--river);color:#04172E;font:700 13px var(--f-display);font-variation-settings:"wdth" 95;letter-spacing:.03em}
.cta:disabled{opacity:.5;cursor:progress}

/* radar dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px));display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:12px;padding:10px 14px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:14px;z-index:10}
.play{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);background:transparent;display:grid;place-items:center}
.dock input{width:100%;accent-color:var(--river)}
.ticks{display:flex;justify-content:space-between;font:500 10.5px var(--f-mono);color:var(--faint);margin-top:2px}
.legend{display:flex;align-items:center;gap:8px;font:500 10.5px var(--f-mono);color:var(--dim)}
.legend i{width:64px;height:6px;border-radius:3px;background:linear-gradient(90deg,#88ddee,#0099cc,#0077aa,#ffee00,#ffaa00,#ff4400,#c10000)}

/* citizen phone */
.phone{position:fixed;right:420px;bottom:96px;width:300px;background:var(--paper);color:var(--paper-ink);border-radius:30px;padding:14px;border:8px solid #10161F;z-index:15;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.phone .notch{width:84px;height:5px;border-radius:3px;background:#C9D0DA;margin:0 auto 12px}
.alert{border-radius:16px;padding:14px;color:#fff;background:var(--lc,var(--u))}
.alert[data-l=yellow]{color:#2B2300}
.alert small{font:600 11px var(--f-hi);opacity:.9}
.alert h4{margin:2px 0 4px;font:28px/1.15 var(--f-hi-display)}
.alert p{margin:0;font:500 12px var(--f-mono);opacity:.9}
.todo{margin:12px 2px;padding:0;list-style:none;display:grid;gap:8px;font:500 15px/1.4 var(--f-hi)}
.todo li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.todo li span{width:22px;height:22px;border-radius:50%;background:var(--paper-ink);color:var(--paper);display:grid;place-items:center;font:600 12px var(--f-mono)}
.listen{width:100%;height:40px;border-radius:12px;border:1px solid var(--paper-line);background:#fff;color:var(--river-deep);font:600 14px var(--f-hi)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.two button{height:56px;border:0;border-radius:14px;color:#fff;font:700 15px/1.2 var(--f-hi)}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:var(--night);padding:8px 14px;border-radius:8px;font-weight:600;z-index:30}

/* map bits */
.maplibregl-ctrl-attrib{background:rgba(6,11,22,.6)!important;color:var(--faint)!important;font-size:10px}
.maplibregl-ctrl-attrib a{color:var(--dim)!important}
.maplibregl-popup-content{background:var(--glass-2);color:var(--ink);border:1px solid var(--line-2);border-radius:10px;font-size:12.5px;padding:10px 12px}
.maplibregl-popup-tip{display:none}
.cyclone{width:18px;height:18px;border-radius:50%;background:var(--r);border:2px solid #fff;position:relative}
.cyclone::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:2px solid var(--r);animation:ping 1.6s infinite}

@media (max-width:1100px){.phone{right:12px}}
@media (max-width:900px){
  body{overflow:auto}
  #map{position:relative;height:56vh;margin-top:56px}
  .panel{position:relative;inset:auto;width:auto;margin:12px max(12px,env(safe-area-inset-left,0px));max-height:none}
  .left .scroll{max-height:340px}
  .dock{position:relative;left:auto;transform:none;margin:12px auto;bottom:auto}
  .phone{position:relative;right:auto;bottom:auto;margin:12px auto}
  .health{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><b>RAHAT</b><span>राहत</span><i>Command centre · India</i></div>
  <div class="health" id="health" aria-label="Data source status"></div>
  <div class="clock" id="clock">--:-- IST</div>
  <button class="toggle" id="citizenBtn" aria-pressed="false">Citizen view</button>
</header>

<div id="map" aria-label="Live map of India with rain radar"></div>

<aside class="panel left" aria-label="Watchlist">
  <header><span class="label">Watchlist · live levels</span><span class="label" id="updated">loading</span></header>
  <div class="scroll" id="list"></div>
</aside>

<aside class="panel right" aria-label="Incident">
  <div class="scroll" id="incident">
    <div class="inc-head"><span class="label">Loading live data</span><h2>Reading the sky…</h2><p>Fetching rainfall, river discharge and cyclone tracks.</p></div>
  </div>
</aside>

<div class="dock" role="group" aria-label="Rain radar timeline">
  <button class="play" id="play" aria-label="Pause radar"><svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><rect x="2" y="1" width="3.5" height="12" rx="1"/><rect x="8.5" y="1" width="3.5" height="12" rx="1"/></svg></button>
  <div><input type="range" id="frame" min="0" max="0" value="0" step="1" aria-label="Radar frame"><div class="ticks"><span id="t0">–</span><span id="tnow" style="color:var(--ink)">–</span></div></div>
  <div class="legend"><span>Rain</span><i></i></div>
</div>

<div class="phone" id="phone" hidden aria-label="Citizen app preview">
  <div class="notch"></div>
  <div id="phoneBody"></div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const PLACES=[
  {id:"ghy",name:"Guwahati",state:"Assam",lat:26.1800,lon:91.7470,river:"Brahmaputra"},
  {id:"bpt",name:"Barpeta",state:"Assam",lat:26.3200,lon:91.0000,river:"Beki"},
  {id:"pat",name:"Patna",state:"Bihar",lat:25.6100,lon:85.1400,river:"Ganga"},
  {id:"kkd",name:"Kakinada",state:"Andhra Pradesh",lat:16.9900,lon:82.2500,river:"Godavari delta"},
  {id:"vsk",name:"Visakhapatnam",state:"Andhra Pradesh",lat:17.6900,lon:83.2200},
  {id:"bbs",name:"Bhubaneswar",state:"Odisha",lat:20.3000,lon:85.8200,river:"Mahanadi"},
  {id:"che",name:"Chennai",state:"Tamil Nadu",lat:13.0800,lon:80.2700},
  {id:"koc",name:"Kochi",state:"Kerala",lat:9.9300,lon:76.2700},
  {id:"bom",name:"Mumbai",state:"Maharashtra",lat:19.0700,lon:72.8800},
  {id:"jai",name:"Jaipur",state:"Rajasthan",lat:26.9100,lon:75.7900},
  {id:"del",name:"Delhi",state:"Delhi",lat:28.6100,lon:77.2100,river:"Yamuna"}
];
const RANK={unknown:-1,green:0,yellow:1,orange:2,red:3};
const COLOR={green:"#22C55E",yellow:"#FACC15",orange:"#FB923C",red:"#EF4444",unknown:"#64748B"};
const HI={red:"लाल चेतावनी",orange:"नारंगी चेतावनी",yellow:"पीली चेतावनी",green:"कोई चेतावनी नहीं",unknown:"स्थिति अज्ञात"};
const ZONE_KM={red:3,orange:2,yellow:1.2,green:0.8,unknown:1};
const SOURCES=["Open-Meteo","GloFAS","RainViewer","GDACS","OSM","Routing"];
const $=s=>document.querySelector(s);
const state={places:[],gdacs:[],sel:null,frames:[],fi:0,playing:!matchMedia("(prefers-reduced-motion: reduce)").matches,timer:null,run:0};

function health(name,s,note){state.health=state.health||{};state.health[name]=[s,note];
  $("#health").innerHTML=SOURCES.map(n=>{const h=state.health[n]||["wait",""];return `<span class="chip" data-s="${h[0]}" title="${h[1]||""}">${n}${h[0]==="fallback"?" · fallback":h[0]==="down"?" · down":""}</span>`}).join("")}
SOURCES.forEach(n=>health(n,"wait"));

async function getJSON(url,opt={},ms=9000){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(url,{...opt,signal:c.signal});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}finally{clearTimeout(t)}}
const km=(a,b,c,d)=>{const R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180;const h=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const circle=(lat,lon,r,n=72)=>{const pts=[];for(let i=0;i<=n;i++){const a=i/n*2*Math.PI;pts.push([lon+r/(111.32*Math.cos(lat*Math.PI/180))*Math.cos(a),lat+r/110.57*Math.sin(a)])}return{type:"Feature",geometry:{type:"Polygon",coordinates:[pts]}}};
const fmt=(v,d=0)=>v==null||isNaN(v)?"–":Number(v).toFixed(d);
const ist=d=>d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Kolkata"});
setInterval(()=>$("#clock").textContent=ist(new Date())+" IST",1000);$("#clock").textContent=ist(new Date())+" IST";

/* ---------- map ---------- */
const map=new maplibregl.Map({container:"map",center:[83,22],zoom:4.1,minZoom:3,maxZoom:16,attributionControl:{compact:true},
  style:{version:8,glyphs:"https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
    sources:{
      sat:{type:"raster",tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],tileSize:256,maxzoom:18,attribution:"Imagery © Esri, Maxar, Earthstar Geographics"},
      lbl:{type:"raster",tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}"],tileSize:256,maxzoom:18,attribution:"Labels © Esri"}
    },
    layers:[{id:"bg",type:"background",paint:{"background-color":"#060B16"}},
      {id:"sat",type:"raster",source:"sat",paint:{"raster-saturation":-0.45,"raster-brightness-max":0.42,"raster-contrast":0.12}},
      {id:"lbl",type:"raster",source:"lbl",paint:{"raster-opacity":0.85}}]}});
map.addControl(new maplibregl.NavigationControl({showCompass:false}),"bottom-right");

map.on("load",()=>{
  map.addSource("zone",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
  map.addLayer({id:"zone-fill",type:"fill",source:"zone",paint:{"fill-color":["get","c"],"fill-opacity":0.09}});
  map.addLayer({id:"zone-line",type:"line",source:"zone",paint:{"line-color":["get","c"],"line-width":1.5,"line-dasharray":[3,2]}});
  map.addSource("route",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
  map.addLayer({id:"route-case",type:"line",source:"route",layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":"#ffffff","line-width":8,"line-opacity":0.9}});
  map.addLayer({id:"route",type:"line",source:"route",layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":"#1D7BFF","line-width":4.5}});
  map.addSource("fac",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
  map.addLayer({id:"fac",type:"circle",source:"fac",paint:{"circle-radius":["case",["get","shelter"],9,["get","exposed"],5,4],
    "circle-color":["case",["get","shelter"],"#22C55E",["==",["get","kind"],"hospital"],"#FF6B81","#9AD0FF"],
    "circle-stroke-color":["case",["get","exposed"],"#EF4444","#06101F"],"circle-stroke-width":["case",["get","shelter"],3,["get","exposed"],2,1]}});
  map.addSource("places",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
  map.addLayer({id:"places-halo",type:"circle",source:"places",paint:{"circle-radius":["interpolate",["linear"],["zoom"],3,10,8,18],"circle-color":["get","c"],"circle-opacity":0.22,"circle-blur":0.4}});
  map.addLayer({id:"places",type:"circle",source:"places",paint:{"circle-radius":["interpolate",["linear"],["zoom"],3,4,8,7],"circle-color":["get","c"],"circle-stroke-color":"#06101F","circle-stroke-width":1.5}});
  map.addSource("origin",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
  map.addLayer({id:"origin",type:"circle",source:"origin",paint:{"circle-radius":7,"circle-color":"#FB923C","circle-stroke-color":"#fff","circle-stroke-width":2.5}});
  map.on("click","places",e=>select(e.features[0].properties.id,true));
  map.on("click","fac",e=>{const p=e.features[0].properties;new maplibregl.Popup({closeButton:false}).setLngLat(e.lngLat).setHTML(`<b>${p.name}</b><br><span class="mono" style="color:var(--dim)">${p.kind}${p.elev!=="null"&&p.elev!=null?" · "+p.elev+" m":""}${p.exposed?" · inside zone":""}${p.shelter?" · chosen shelter":""}</span>`).addTo(map)});
  ["places","fac"].forEach(l=>{map.on("mouseenter",l,()=>map.getCanvas().style.cursor="pointer");map.on("mouseleave",l,()=>map.getCanvas().style.cursor="")});

/* ---------- radar (RainViewer) ---------- */
async function loadRadar(){
  try{const d=await getJSON("https://api.rainviewer.com/public/weather-maps.json");
    const frames=[...(d.radar.past||[]),...(d.radar.nowcast||[])];
    frames.forEach((f,i)=>{map.addSource("rv"+i,{type:"raster",tiles:[`${d.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`],tileSize:256,maxzoom:7,attribution:"Radar © RainViewer"});
      map.addLayer({id:"rv"+i,type:"raster",source:"rv"+i,paint:{"raster-opacity":0,"raster-opacity-transition":{duration:250}}},"zone-fill")});
    state.frames=frames;const fr=$("#frame");fr.max=frames.length-1;fr.value=frames.length-1;
    $("#t0").textContent=ist(new Date(frames[0].time*1000));$("#tnow").textContent=ist(new Date(frames.at(-1).time*1000))+" latest";
    showFrame(frames.length-1);health("RainViewer","live",`${frames.length} frames`);if(state.playing)play();
  }catch(e){health("RainViewer","down",e.message);$("#tnow").textContent="radar unavailable"}
}
function showFrame(i){state.frames.forEach((_,k)=>map.setPaintProperty("rv"+k,"raster-opacity",k===i?0.72:0));state.fi=i;$("#frame").value=i;
  $("#tnow").textContent=ist(new Date(state.frames[i].time*1000))+(i===state.frames.length-1?" latest":"")}
function play(){clearInterval(state.timer);let hold=0;state.timer=setInterval(()=>{if(state.fi===state.frames.length-1&&hold++<3)return;hold=0;showFrame((state.fi+1)%state.frames.length)},550)}
$("#play").onclick=()=>{state.playing=!state.playing;if(state.playing)play();else clearInterval(state.timer);
  $("#play").setAttribute("aria-label",state.playing?"Pause radar":"Play radar");
  $("#play").innerHTML=state.playing?'<svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><rect x="2" y="1" width="3.5" height="12" rx="1"/><rect x="8.5" y="1" width="3.5" height="12" rx="1"/></svg>':'<svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M3 1.5v11l9-5.5z"/></svg>'};
$("#frame").oninput=e=>{state.playing=true;$("#play").click();showFrame(+e.target.value)};

/* ---------- live levels: Open-Meteo + GloFAS + GDACS, scored by fixed rules ---------- */
async function loadLevels(){
  const lat=PLACES.map(p=>p.lat).join(","),lon=PLACES.map(p=>p.lon).join(",");
  const t0=performance.now();
  const [fc,fl,gd]=await Promise.allSettled([
    getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=precipitation&forecast_hours=24&daily=precipitation_sum,temperature_2m_max&forecast_days=7&timezone=Asia%2FKolkata`),
    getJSON(`https://flood-api.open-meteo.com/v1/flood?latitude=${lat}&longitude=${lon}&daily=river_discharge,river_discharge_median&forecast_days=7`),
    getJSON("https://www.gdacs.org/gdacsapi/api/events/geteventlist/SEARCH?country=IND&limit=20")]);
  state.fetchMs=Math.round(performance.now()-t0);
  health("Open-Meteo",fc.status==="fulfilled"?"live":"down",fc.reason?.message);
  health("GloFAS",fl.status==="fulfilled"?"live":"down",fl.reason?.message);
  health("GDACS",gd.status==="fulfilled"?"live":"down",gd.reason?.message);
  const F=fc.status==="fulfilled"?[].concat(fc.value):[],L=fl.status==="fulfilled"?[].concat(fl.value):[];
  const now=Date.now();
  state.gdacs=gd.status==="fulfilled"?(gd.value.features||[]).filter(f=>{const p=f.properties;return String(p.iscurrent)==="true"||(now-new Date(p.todate).getTime())<5*864e5}):[];
  state.gdacs.forEach(f=>{const el=document.createElement("div");el.className="cyclone";el.style.background=el.style.borderColor="";
    new maplibregl.Marker({element:el}).setLngLat(f.geometry.coordinates).setPopup(new maplibregl.Popup({closeButton:false}).setHTML(`<b>${f.properties.name}</b><br><span class="mono" style="color:var(--dim)">GDACS · ${f.properties.alertlevel} alert</span>`)).addTo(map)});
  state.places=PLACES.map((p,i)=>score(p,F[i],L[i]));
  state.places.sort((a,b)=>RANK[b.level]-RANK[a.level]||(b.rain24||0)-(a.rain24||0));
  $("#updated").textContent="updated "+ist(new Date());
  map.getSource("places").setData({type:"FeatureCollection",features:state.places.map(p=>({type:"Feature",properties:{id:p.id,c:COLOR[p.level]},geometry:{type:"Point",coordinates:[p.lon,p.lat]}}))});
  renderList();select(state.places[0].id,false);
}
function score(p,f,l){
  const o={...p,rules:[],level:"unknown"};
  if(f){o.rain24=f.hourly.precipitation.reduce((s,v)=>s+(v||0),0);o.tmax=Math.max(...f.daily.temperature_2m_max.slice(0,3));o.rain7=f.daily.precipitation_sum;
    const r=o.rain24,lv=r>=204.5?"red":r>=115.6?"orange":r>=64.5?"yellow":"green";
    o.rules.push({lv,txt:`Rain next 24 h: ${fmt(r,1)} mm`,why:r>=64.5?`≥ ${lv==="red"?"204.5":lv==="orange"?"115.6":"64.5"} mm · IMD ${lv==="red"?"extremely heavy":lv==="orange"?"very heavy":"heavy"}`:"below IMD heavy-rain threshold (64.5 mm)",src:"Open-Meteo"});
    const t=o.tmax,tl=t>=45?"red":t>=40?"orange":t>=37?"yellow":"green";
    o.rules.push({lv:tl,txt:`Max temperature, 3 days: ${fmt(t,1)} °C`,why:t>=37?`heat rule ≥ ${tl==="red"?45:tl==="orange"?40:37} °C`:"below heat thresholds",src:"Open-Meteo"})}
  if(l&&l.daily){const q=l.daily.river_discharge,m=l.daily.river_discharge_median;const med=m[0],peak=Math.max(...q.slice(0,3).filter(v=>v!=null));o.q7=q;
    if(med>=50){o.ratio=peak/med;const rl=o.ratio>=3?"red":o.ratio>=2?"orange":o.ratio>=1.5?"yellow":"green";
      o.rules.push({lv:rl,txt:`River discharge ${p.river?"("+p.river+") ":""}${fmt(peak)} m³/s, ${fmt(o.ratio,2)}× median`,why:o.ratio>=1.5?`≥ ${rl==="red"?3:rl==="orange"?2:1.5}× seasonal median`:"within seasonal range",src:"GloFAS"})}
    else o.rules.push({lv:"green",txt:"No major river at this grid cell",why:`median ${fmt(med)} m³/s < 50, river rule skipped`,src:"GloFAS"})}
  state.gdacs.forEach(g=>{const [glon,glat]=g.geometry.coordinates;const d=km(p.lat,p.lon,glat,glon);const al=String(g.properties.alertlevel).toLowerCase();
    if(d<350&&(al==="red"||al==="orange")){o.cyclone=`${g.properties.eventname||g.properties.name} ${Math.round(d)} km away`;
      o.rules.push({lv:al==="red"?"orange":"yellow",txt:`${g.properties.name}, ${Math.round(d)} km away`,why:`GDACS ${g.properties.alertlevel} alert within 350 km · official alert can only raise the level`,src:"GDACS"})}});
  if(o.rules.length)o.level=o.rules.reduce((a,r)=>RANK[r.lv]>RANK[a]?r.lv:a,"green");
  o.driver=o.rules.length?o.rules.reduce((a,r)=>RANK[r.lv]>RANK[a.lv]?r:a):null;
  return o;
}
function spark(vals,c){if(!vals||!vals.length)return"";const v=vals.map(x=>x||0),mx=Math.max(1,...v),w=280,h=26;
  const pts=v.map((y,i)=>[i/(v.length-1)*w,h-2-(y/mx)*(h-6)]);const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L${w} ${h} L0 ${h}Z" fill="${c}" opacity=".14"/><path d="${d}" fill="none" stroke="${c}" stroke-width="1.5" vector-effect="non-scaling-stroke"/><circle cx="${pts[0][0]}" cy="${pts[0][1]}" r="2.5" fill="${c}"/></svg>`}
function gauge(l){return `<span class="gauge" data-l="${l}"><span class="seg"><i></i><i></i><i></i><i></i></span>${l==="unknown"?"NO DATA":l.toUpperCase()}</span>`}
function renderList(){
  $("#list").innerHTML=state.places.map(p=>`<button class="place" data-id="${p.id}" aria-current="${state.sel?.id===p.id}">
    <h3>${p.name}</h3>${gauge(p.level)}
    <span class="sub">${p.state}${p.cyclone?" · "+p.cyclone:p.driver&&RANK[p.driver.lv]>0?" · "+p.driver.txt.split(":")[0].toLowerCase():""}</span>
    <span class="metrics"><span>Rain 24h <b>${fmt(p.rain24,0)}</b> mm</span><span>River <b>${p.ratio?fmt(p.ratio,1)+"×":"–"}</b></span><span>Max <b>${fmt(p.tmax,0)}</b>°</span></span>
    ${spark(p.rain7,COLOR[p.level])}</button>`).join("");
  document.querySelectorAll(".place").forEach(b=>b.onclick=()=>select(b.dataset.id,true));
}

/* ---------- incident + response plan ---------- */
function select(id,fly){const p=state.places.find(x=>x.id===id);state.sel=p;renderList();
  map.getSource("zone").setData(circle(p.lat,p.lon,ZONE_KM[p.level]));map.getSource("zone").setData({type:"FeatureCollection",features:[{...circle(p.lat,p.lon,ZONE_KM[p.level]),properties:{c:COLOR[p.level]}}]});
  ["route","fac"].forEach(s=>map.getSource(s).setData({type:"FeatureCollection",features:[]}));
  map.getSource("origin").setData({type:"FeatureCollection",features:[{type:"Feature",geometry:{type:"Point",coordinates:[p.lon,p.lat]}}]});
  if(fly)map.flyTo({center:[p.lon,p.lat],zoom:12.3,speed:1.3});
  renderIncident(p);
}
function renderIncident(p){
  $("#incident").innerHTML=`
  <div class="inc-head"><div style="display:flex;justify-content:space-between;align-items:center"><span class="label">${p.state}${p.river?" · "+p.river:""}</span>${gauge(p.level)}</div>
    <h2>${p.name}</h2><p class="mono">${fmt(p.lat,3)}°N ${fmt(p.lon,3)}°E · scored ${ist(new Date())} IST · ${state.fetchMs} ms</p></div>
  <div class="sec"><div class="label">Why this level <span class="tag">rules, not the LLM</span></div>
    <ul class="why">${p.rules.map(r=>`<li style="--c:${COLOR[r.lv]}"><span>${r.txt}<small>${r.why} · ${r.src}</small></span></li>`).join("")||"<li>No data reached us. Level is unknown, never assumed safe.</li>"}</ul></div>
  <div class="sec"><div class="label">Response plan <span class="tag" id="runTag">ready</span></div>
    <ol class="trace" id="trace">${["Sentinel","Impact","Logistics","Verifier","Comms"].map((s,i)=>`<li class="step" data-s="idle" id="st${i}"><span class="dot">${i+1}</span><div><b>${s}</b><p>Waiting</p></div><span class="t"></span></li>`).join("")}</ol>
    <button class="cta" id="runBtn">Run plan for an SOS at this point</button></div>
  <div class="sec" id="msgSec" hidden><div class="label">Drafted alert · Hindi + English</div><div class="msg" id="msg"></div></div>
  <div class="sec"><div class="label">Heard → safe <span class="tag">starts when alerts go out on Telegram</span></div>
    <div class="funnel"><div><b>0</b><span>alerted</span></div><div><b>0</b><span>heard</span></div><div><b style="color:var(--g)">0</b><span>safe</span></div><div><b style="color:var(--r)">0</b><span>need help</span></div></div>
    <div class="bar"></div></div>`;
  $("#runBtn").onclick=()=>runPlan(p);
}
function step(i,s,text,ms,srcs=[]){const el=$("#st"+i);if(!el)return;el.dataset.s=s;el.querySelector("p").innerHTML=text+(srcs.length?"<br>"+srcs.map(x=>`<span class="src${x.startsWith("!")?" warn":""}">${x.replace(/^!/,"")}</span>`).join(""):"");el.querySelector(".t").textContent=ms!=null?ms+" ms":""}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

async function facilities(p,r){
  const rad=Math.round(Math.max(4,r*2.2)*1000);
  const q=`[out:json][timeout:15];(node["amenity"~"^(hospital|school|college)$"](around:${rad},${p.lat},${p.lon});way["amenity"~"^(hospital|school|college)$"](around:${rad},${p.lat},${p.lon}););out center 80;`;
  for(const host of["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"]){
    try{const d=await getJSON(host,{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"}},8000);
      return{via:"Overpass",items:d.elements.map(e=>({name:e.tags?.name||e.tags?.amenity,kind:e.tags.amenity==="hospital"?"hospital":"school",lat:e.lat??e.center?.lat,lon:e.lon??e.center?.lon})).filter(x=>x.lat)}}catch(e){}}
  const dg=rad/111000,vb=[p.lon-dg,p.lat+dg,p.lon+dg,p.lat-dg].join(","),out=[];
  for(const k of["school","hospital"]){try{const d=await getJSON(`https://nominatim.openstreetmap.org/search?q=${k}&viewbox=${vb}&bounded=1&format=jsonv2&limit=40`);
    d.forEach(e=>out.push({name:e.name||k,kind:k,lat:+e.lat,lon:+e.lon}))}catch(e){}await wait(1100)}
  if(!out.length)throw new Error("all facility sources failed");return{via:"Nominatim",items:out};
}
async function route(a,b){
  const tries=[["walk","https://routing.openstreetmap.de/routed-foot/route/v1/foot/"],["drive","https://router.project-osrm.org/route/v1/driving/"]];
  for(const [mode,base] of tries){try{const d=await getJSON(`${base}${a.lon},${a.lat};${b.lon},${b.lat}?overview=full&geometries=geojson`,{},8000);
    if(d.code==="Ok")return{mode,via:mode==="walk"?"OSM foot router":"OSRM driving",r:d.routes[0]}}catch(e){}}
  return null;
}
async function runPlan(p){
  const run=++state.run;const btn=$("#runBtn");btn.disabled=true;btn.textContent="Running…";$("#runTag").textContent="running";
  const r=ZONE_KM[p.level];let t=performance.now();
  step(0,"run","Reading hazard rules");await wait(350);
  step(0,"ok",`Level <b style="color:${COLOR[p.level]}">${p.level.toUpperCase()}</b>. ${p.driver?p.driver.txt:"no data"}. Zone radius ${r} km by rule.`,state.fetchMs,[...new Set(p.rules.map(x=>x.src))]);
  step(1,"run","Finding hospitals, schools and colleges nearby");t=performance.now();
  let fac;try{fac=await facilities(p,r)}catch(e){step(1,"fail","Every facility source failed. Escalated to a human operator.",Math.round(performance.now()-t),["!Overpass down","!Nominatim down"]);health("OSM","down");done(btn);return}
  if(run!==state.run)return;
  health("OSM",fac.via==="Overpass"?"live":"fallback",fac.via);
  const items=fac.items.map(f=>({...f,d:km(p.lat,p.lon,f.lat,f.lon)}));items.forEach(f=>f.exposed=f.d<=r);
  const exposed=items.filter(f=>f.exposed),cands=items.filter(f=>!f.exposed&&f.kind==="school").sort((a,b)=>a.d-b.d).slice(0,40);
  let elevNote="";try{const pts=[{lat:p.lat,lon:p.lon},...cands];const e=await getJSON(`https://api.open-meteo.com/v1/elevation?latitude=${pts.map(x=>x.lat.toFixed(5)).join(",")}&longitude=${pts.map(x=>x.lon.toFixed(5)).join(",")}`);
    p.elev=e.elevation[0];cands.forEach((c,i)=>c.elev=e.elevation[i+1]);elevNote=`Origin ${fmt(p.elev)} m above sea level.`}catch(e){elevNote="Elevation unavailable, using distance only."}
  step(1,fac.via==="Overpass"?"ok":"fix",`${items.length} facilities found, <b>${exposed.length}</b> inside the zone (${exposed.filter(f=>f.kind==="hospital").length} hospitals). ${elevNote}`,Math.round(performance.now()-t),fac.via==="Overpass"?["Overpass","Open-Meteo elevation"]:["!Overpass busy → Nominatim","Open-Meteo elevation"]);
  step(2,"run","Choosing a shelter outside the zone, on higher ground");t=performance.now();
  const high=cands.filter(c=>c.elev!=null&&p.elev!=null&&c.elev>=p.elev+2);const shelter=(high[0]||cands[0]);
  if(!shelter){step(2,"fail","No school outside the zone within range. Widening the search is the next step.",Math.round(performance.now()-t));done(btn);return}
  shelter.shelter=true;
  map.getSource("fac").setData({type:"FeatureCollection",features:items.map(f=>({type:"Feature",properties:{name:f.name,kind:f.kind,exposed:f.exposed,shelter:!!f.shelter,elev:f.elev!=null?Math.round(f.elev):null},geometry:{type:"Point",coordinates:[f.lon,f.lat]}}))});
  const rt=await route(p,shelter);if(run!==state.run)return;
  let coords;
  if(rt){coords=rt.r.geometry.coordinates;health("Routing",rt.mode==="walk"?"live":"fallback",rt.via);
    step(2,rt.mode==="walk"?"ok":"fix",`Shelter: <b>${shelter.name}</b>${shelter.elev!=null?`, ${fmt(shelter.elev)} m`:""}. ${rt.mode==="walk"?"Walk":"Drive"} ${(rt.r.distance/1000).toFixed(1)} km, about ${Math.round(rt.r.duration/60)} min.`,Math.round(performance.now()-t),rt.mode==="walk"?["OSM foot router"]:["!foot router failed → OSRM driving"])}
  else{coords=[[p.lon,p.lat],[shelter.lon,shelter.lat]];health("Routing","down");step(2,"fix",`Shelter: <b>${shelter.name}</b>. Routing services down, showing straight line. Not a safe path.`,Math.round(performance.now()-t),["!routing down"])}
  animateRoute(coords,run);
  const b=new maplibregl.LngLatBounds();coords.forEach(c=>b.extend(c));b.extend([p.lon,p.lat]);map.fitBounds(b,{padding:{top:110,bottom:130,left:360,right:440},maxZoom:15,duration:900});
  step(3,"run","Checking route geometry and every number");await wait(400);t=performance.now();
  const inside=coords.map(c=>km(p.lat,p.lon,c[1],c[0])<=r);const exitIdx=inside.indexOf(false);const reenter=exitIdx>=0&&inside.slice(exitIdx).some(Boolean);
  let exitM=0;for(let i=1;i<=Math.max(exitIdx,0);i++)exitM+=km(coords[i-1][1],coords[i-1][0],coords[i][1],coords[i][0])*1000;
  step(3,reenter||!rt?"fix":"ok",reenter?"Route re-enters the hazard zone. Flagged for human review.":`Route leaves the zone after ${Math.round(exitM)} m and never re-enters. All ${p.rules.length+3} numbers trace to a source.`,Math.round(performance.now()-t),["geometry check","citation check"]);
  step(4,"run","Writing the alert");await wait(450);
  const dist=rt?(rt.r.distance/1000).toFixed(1):fmt(shelter.d,1),mins=rt?Math.round(rt.r.duration/60):null;
  const hi=`${p.name}: ${HI[p.level]}। ${p.level==="green"?"अभी कोई बड़ा खतरा नहीं है, पर सतर्क रहें।":"ऊँची और सुरक्षित जगह पर जाएँ।"} नज़दीकी सुरक्षित स्थान: ${shelter.name}, ${dist} किमी${mins?`, ${rt.mode==="walk"?"पैदल":"गाड़ी से"} लगभग ${mins} मिनट`:""}।`;
  const en=`${p.name}: ${p.level.toUpperCase()} level. ${p.driver?p.driver.txt+".":""} Nearest safe place: ${shelter.name}, ${dist} km${mins?`, about ${mins} min ${rt.mode==="walk"?"on foot":"by road"}`:""}.`;
  state.msg={p,hi,en,shelter,dist,mins,mode:rt?.mode};
  $("#msgSec").hidden=false;$("#msg").innerHTML=`<div class="hi" lang="hi">${hi}</div><div class="en">${en}</div>`;
  step(4,"ok","Template filled only from verified values. Voice via Sarvam once the backend is connected.",Math.round(performance.now()-t),["template","no free text"]);
  renderPhone();done(btn);
}
function done(btn){btn.disabled=false;btn.textContent="Run again";$("#runTag").textContent="done"}
function animateRoute(coords,run){const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;let i=reduce?coords.length:2;
  const tick=()=>{if(run!==state.run)return;map.getSource("route").setData({type:"Feature",geometry:{type:"LineString",coordinates:coords.slice(0,i)}});if(i<coords.length){i+=Math.max(1,Math.round(coords.length/60));requestAnimationFrame(tick)}};tick()}

/* ---------- citizen view ---------- */

  <ol class="todo" lang="hi"><li><span>1</span>${l==="green"?"सतर्क रहें, खबरों पर नज़र रखें":"ऊँची जगह पर जाएँ"}</li><li><span>2</span>सुरक्षित स्थान: ${m.shelter.name} · ${m.dist} किमी</li><li><span>3</span>${m.mins?`${m.mode==="walk"?"पैदल":"गाड़ी से"} लगभग ${m.mins} मिनट`:"रास्ता ऐप में देखें"}</li></ol>
  <button class="listen" id="listen" lang="hi">सुनें · Listen</button>
  <div class="two"><button style="background:#15803D" id="safe">मैं सुरक्षित हूँ</button><button style="background:#DC2626" id="help">मदद चाहिए</button></div>`;
  $("#listen").onclick=()=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(m.hi);u.lang="hi-IN";speechSynthesis.speak(u)}catch(e){toast("Speech not available in this browser")}};

function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2200)}
$("#citizenBtn").onclick=e=>{const on=e.currentTarget.getAttribute("aria-pressed")!=="true";e.currentTarget.setAttribute("aria-pressed",on);$("#phone").hidden=!on;renderPhone()};
